<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Galaxy</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }
    #info {
      position: fixed;
      top: 12px;
      left: 16px;
      color: #cfd8ff;
      font-size: 14px;
      opacity: 0.8;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="myCanvas"></canvas>
  <div id="info">Spiral Galaxy: built with ctx.arc() &middot; click to make a new galaxy</div>
  <script src="app.js"></script>
</body>
</html>
